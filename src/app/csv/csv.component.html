<p>csv works!</p>


<button (click)="readCsv()"> Read CSV </button>

<h3>Search Contacts</h3>

<input
  type="text"
  placeholder="Enter name"
  #searchInput
  (input)="searchContacts(searchInput.value)"
/>
<h3>Saved Contacts</h3>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
        </tr>
    </thead>

    <tbody>
        @for (contact of contacts; track contact.id) {
        <tr>
            <td>{{ contact.id }}</td>
            <td>{{ contact.name }}</td>
            <td>{{ contact.phone }}</td>
        </tr>
        }
    </tbody>
</table>
