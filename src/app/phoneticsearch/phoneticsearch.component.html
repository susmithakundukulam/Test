 <h2>Phonetic Library Search</h2>
<div style="padding:20px">

    <input pInputText type="text" [(ngModel)]="searchQuery" (ngModelChange)="filterPeople($event)"
    placeholder="Search any" />

    <p-table #contactsTable [value]="filteredPeople" [globalFilterFields]="['name']">

        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Extension</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-person>
            <tr>
                <td>{{ person.name }}</td>
                <td>{{ person.department }}</td>
                <td>{{ person.extension }}</td>
            </tr>
        </ng-template>

    </p-table>



</div>
